<html>
  <head>
    <title>Scratchssenger Web Client</title>
    <style>
      body {
        margin: 0;
        display: flex;
        min-width: 320px;
        min-height: 100vh;
      }
      .app {
        display: flex;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      .messengerNameBar {
        color: #dfdede;
        background-color: #83c1e7;
        margin: 0;
        padding: 16px;
        font-size: 1.2rem;
        font-weight: 600;
        text-align: center;
      }
      .leftBar {
        width: 350px;
        min-width: 350px;
        max-width: 350px;
        height: 100%;
        border-right: 1px solid #ddd;
        display: flex;
        flex-direction: column;
        background: #fff;
      }
      .messages {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        background-color: #f0f2f5;
        width: 100%;
        background-size: 100%;
        border-radius: 4px;
        min-width: 0;
        overflow: hidden;
      }
      .chatNameBar {
        background-color: #ffffff;
        margin: 0;
        padding: 10px;
        padding-left: 21px;
        display: block;
        text-align: left;
      }
      .chatNameBar h1 {
        color: rgb(0, 0, 0);
        font-size: 1rem;
        font-weight: 600;
        margin: 0;
      }
      .chatNameBar span {
        color: rgb(0, 0, 0);
        font-size: 0.7rem;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <h1>Please, enable JavaScript for using Scratchssenger</h1>
  </body>
  <script type="module" src="/js/web-client/main.js"></script>
  <script>
    async function login() {
      try {
        const login = await(await fetch("https://dcgapi.loca.lt/scratchssenger/login/", {
          method: "POST",
          body: JSON.stringify({
            login: document.getElementById("username").value,
            password: document.getElementById("password").value
          })
        })).json()
        localStorage.setItem("login", document.getElementById("username").value)
        localStorage.setItem("session", login.result.session)
      } catch (error) {
        console.log(error)
      }
    }
    async function register() {
      try {
        await fetch("https://dcgapi.loca.lt/scratchssenger/register/", {
          method: "POST",
          body: JSON.stringify({
            login: document.getElementById("username").value,
            password: document.getElementById("password").value
          })
        })
      } catch (error) {
        console.log(error)
      }
    }
  </script>
</html>
